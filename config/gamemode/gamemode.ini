[general]
; Users in the 'gamemode' group can request game mode without a polkit prompt.
; Run: sudo usermod -aG gamemode $USER
reaper_freq=5
desired_governor=performance
default_governor=powersave
; Log to journal instead of a file
log_to_syslog=1
log_to_stderr=0

[filter]
; Allow all processes to request gamemode (whitelist kept empty = open)
whitelist=
blacklist=

[gpu]
; NVIDIA: use nvidia-smi to switch Power Limit mode.
; 0 = auto-detected, 1 = NVIDIA, 2 = AMD, 3 = Intel
gpu_device=0
apply_gpu_optimisations=accept-responsibility
; NVIDIA Power Limit (% of TDP). 100 = max sustained boost.
nv_powermizer_mode=1

[cpu]
; Park all logical CPUs to the 'performance' governor while game runs.
park_cores=no
pin_cores=yes

[supervisor]
; On activation/deactivation, gamemode can call custom scripts.
; These are provided by polyomino — they toggle Sway blur and VRR.
supervisor_whitelist=
supervisor_blacklist=

[custom]
; Scripts called on game start/end. polyomino-gamemode handles Sway compositor tweaks.
start=polyomino-gamemode on
end=polyomino-gamemode off

[ioprio]
ioprio=0
