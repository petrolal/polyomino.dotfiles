# ~/.config/foot/foot.ini
# Polyomino Foot Wayland Terminal Configuration — CAD / Geometric Arcade Visual Identity

font=JetBrainsMono Nerd Font:size=11
pad=8x8
dpi-aware=yes

[cursor]
style=block
color=0F1117 EBB434
blink=no

[colors]
alpha=0.82
background=0F1117
foreground=F8FAFC

## Normal / Regular ANSI colors
regular0=191C24  # black / mantle
regular1=EF4444  # red
regular2=10B981  # green
regular3=F59E0B  # yellow
regular4=EBB434  # blue / accent primary
regular5=00D2D3  # magenta / teal
regular6=00D2D3  # cyan
regular7=F8FAFC  # white / text

## Bright ANSI colors
bright0=2E4057   # bright black / overlay0
bright1=EF4444   # bright red
bright2=10B981   # bright green
bright3=F59E0B   # bright yellow
bright4=EBB434   # bright blue
bright5=00D2D3   # bright magenta
bright6=38BDF8   # bright cyan
bright7=FFFFFF   # bright white
