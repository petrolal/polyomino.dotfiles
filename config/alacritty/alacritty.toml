# ~/.config/alacritty/alacritty.toml
# Polyomino Alacritty Terminal Configuration — CAD / Geometric Arcade Visual Identity

[window]
padding = { x = 8, y = 8 }
decorations = "none"
opacity = 0.82
blur = true

[font]
size = 11.0
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }

[colors.primary]
background = "#0F1117"
foreground = "#F8FAFC"

[colors.cursor]
text = "#0F1117"
cursor = "#EBB434"

[colors.selection]
text = "#0F1117"
background = "#EBB434"

[colors.normal]
black = "#191C24"
red = "#EF4444"
green = "#10B981"
yellow = "#F59E0B"
blue = "#EBB434"
magenta = "#00D2D3"
cyan = "#00D2D3"
white = "#F8FAFC"

[colors.bright]
black = "#2E4057"
red = "#EF4444"
green = "#10B981"
yellow = "#F59E0B"
blue = "#EBB434"
magenta = "#00D2D3"
cyan = "#38BDF8"
white = "#FFFFFF"
